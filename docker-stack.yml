version: "3.8"

services:
  gateway:
    image: ghcr.io/ericocesar/emulador-gateway:sha-953836b
    networks:
      - interna
      - externa
      - emulador-internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - whatsapp-apk:/apk:rw
    environment:
      - DATABASE_URL=postgres://emulador:EmuladorDB2026Bolt!@postgres:5432/emulador?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=55823f7608d92c0922652664b5503021de76f41b907028b09a0d501e88425be2
      - ADB_HOST=172.17.0.1
      - WHATSAPP_APK_PATH=/apk/whatsapp.apk
      - PORT=8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      replicas: 1
      placement:
          constraints:
            - node.role == manager
      resources:
        limits:
          memory: 128M
      labels:
        - traefik.enable=true
        - traefik.docker.network=interna
        - traefik.http.routers.emulador-api.rule=Host(`emulador.bchat.com.br`) && (PathPrefix(`/api`) || PathPrefix(`/health`))
        - traefik.http.routers.emulador-api.entrypoints=websecure
        - traefik.http.routers.emulador-api.tls.certresolver=cf
        - traefik.http.routers.emulador-api.tls=true
        - traefik.http.routers.emulador-api.priority=100
        - traefik.http.services.emulador-api.loadbalancer.server.port=8080
        - traefik.http.services.emulador-api.loadbalancer.passHostHeader=true

  frontend:
    image: ghcr.io/ericocesar/emulador-frontend:sha-953836b
    user: "0:0"
    networks:
      - interna
      - externa
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 64M
      labels:
        - traefik.enable=true
        - traefik.docker.network=interna
        - traefik.http.routers.emulador-frontend.rule=Host(`emulador.bchat.com.br`)
        - traefik.http.routers.emulador-frontend.entrypoints=websecure
        - traefik.http.routers.emulador-frontend.tls.certresolver=cf
        - traefik.http.routers.emulador-frontend.tls=true
        - traefik.http.routers.emulador-frontend.priority=1
        - traefik.http.services.emulador-frontend.loadbalancer.server.port=80

  postgres:
    image: postgres:15-alpine
    networks:
      - emulador-internal
    environment:
      - POSTGRES_DB=emulador
      - POSTGRES_USER=emulador
      - POSTGRES_PASSWORD=EmuladorDB2026Bolt!
    volumes:
      - emulador-pgdata:/var/lib/postgresql/data
    deploy:
      replicas: 1
      placement:
          constraints:
            - node.role == manager
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    networks:
      - emulador-internal
    volumes:
      - emulador-redis:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M

networks:
  interna:
    external: true
  externa:
    external: true
  emulador-internal:
    driver: overlay

volumes:
  emulador-pgdata:
  emulador-redis:
  whatsapp-apk:
